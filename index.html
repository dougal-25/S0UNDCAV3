<!--
  S0UNDCAV3 — holding page.

  Deliberately self-contained: one file, plus the logo SVG and the drone mp3.
  It does not load css/style.css, js/app.js, the Supabase SDK or anything else
  from the studio build, so it keeps working with the backend and database
  switched off. The app is untouched in git history — see wiki/log.md.
-->

<style>
  :root {
    --bg:        #0a0a0a;
    --text:      #e8e8e8;
    --muted:     #888;
    --faint:     #4a4a4a;
    --accent:    #ff4500;
    --mono:      'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --tracking:  0.18em;
    --cave-pulse: 0;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Centred logo + wordmark ─────────────────────────── */
  .cave-logo {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    text-align: center;
    animation: fadeIn 0.6s ease 0.2s backwards;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .cave-logo-tag {
    display: block;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* The pulse halo lives on the mount so it applies to the <img> fallback
     and the inlined <svg> alike. Origin is the orange dot inside the mark
     (512/1024 x 553/1024 in the SVG viewBox) so it breathes from the centre. */
  .cave-logo-mount {
    display: block;
    margin: 8px auto 0;
    width: 200px; height: 200px;
    max-width: 36vmin;
    transform-origin: 50% 54%;
    transform: scale(calc(1 + var(--cave-pulse) * 0.04));
    transition: transform 40ms linear;
    filter:
      drop-shadow(0 0 calc(14px + var(--cave-pulse) * 14px) rgba(255, 69, 0, calc(0.55 + var(--cave-pulse) * 0.25)))
      drop-shadow(0 0 calc(36px + var(--cave-pulse) * 24px) rgba(255, 69, 0, 0.30))
      drop-shadow(0 0 80px rgba(255, 69, 0, 0.18));
  }
  .cave-logo-mount > img,
  .cave-logo-mount > svg { display: block; width: 100%; height: 100%; }

  .cave-logo-text {
    font-weight: 500;
    font-size: 26px;
    letter-spacing: var(--tracking);
    color: #fff;
    text-transform: uppercase;
    margin-top: 8px;
  }
  @media (max-width: 480px) { .cave-logo-text { font-size: 20px; } }

  /* Shown only when the browser blocks autoplay until a gesture. */
  .cave-hint {
    margin-top: 18px;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--faint);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .cave-hint.show { opacity: 1; animation: hintPulse 2.6s ease-in-out infinite; }
  @keyframes hintPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }

  /* ── Corner furniture ────────────────────────────────── */
  .cave-sound-toggle {
    position: absolute;
    top: 24px; right: 24px;
    z-index: 6;
    background: transparent;
    border: 1px solid var(--faint);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 8px 12px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .cave-sound-toggle:hover,
  .cave-sound-toggle.is-on { color: var(--accent); border-color: var(--accent); }
  .cave-sound-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cave-stamp {
    position: absolute;
    bottom: 24px; left: 24px;
    z-index: 6;
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--faint);
    text-transform: uppercase;
  }
  @media (max-width: 480px) {
    .cave-sound-toggle { top: 16px; right: 16px; }
    .cave-stamp { bottom: 16px; left: 16px; }
  }

  /* ── CRT scanlines + grain + vignette ────────────────── */
  .cave-crt { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .cave-crt::before {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }
  .cave-crt::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
  }
  .cave-grain {
    position: absolute; inset: -10%;
    pointer-events: none;
    opacity: 0.06;
    z-index: 4;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation: grainShift 1.6s steps(6) infinite;
  }
  @keyframes grainShift {
    0%   { transform: translate(0, 0); }
    20%  { transform: translate(-3%, 2%); }
    40%  { transform: translate(2%, -2%); }
    60%  { transform: translate(-2%, -3%); }
    80%  { transform: translate(3%, 2%); }
    100% { transform: translate(0, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cave-grain { animation: none; }
    .cave-logo  { animation: none; }
    .cave-logo-mount { transition: none; }
    .cave-hint.show { animation: none; opacity: 0.7; }
    .cave-logo-mount > svg path { transition: none !important; }
  }
</style>

<div class="cave-crt" aria-hidden="true"></div>
<div class="cave-grain" aria-hidden="true"></div>

<button type="button" class="cave-sound-toggle" id="soundToggle"
        aria-pressed="true" aria-label="Toggle ambient sound">
  {SOUND <span id="soundState">ON</span>}
</button>

<div class="cave-stamp">{51.5°N 0.1°W}</div>

<main class="cave-logo">
  <span class="cave-logo-tag">{HEADPHONES RECOMMENDED}</span>
  <div class="cave-logo-mount" id="logoMount">
    <img src="brand/logo/soundcave_logo_2026-05-11.svg" alt="S0UNDCAV3" width="400" height="400">
  </div>
  <h1 class="cave-logo-text">S0UNDCAV3</h1>
  <p class="cave-hint" id="soundHint" aria-live="polite">{TAP ANYWHERE FOR SOUND}</p>
</main>

<script>
(function () {
  'use strict';

  var AUDIO_URL     = 'audio/cave_drone.mp3';
  var TARGET_VOLUME = 0.35;
  var PLAYBACK_RATE = 0.9;          // a touch slower than the original
  var STORAGE_KEY   = 'sc_sound_on';

  var toggle   = document.getElementById('soundToggle');
  var stateEl  = document.getElementById('soundState');
  var hintEl   = document.getElementById('soundHint');
  var root     = document.documentElement;

  var ctx = null, nodes = null, buffer = null, raf = null;

  // Sound is ON by default. Only an explicit OFF is remembered — a stored
  // value is the single source of truth once the visitor has chosen.
  var stored = null;
  try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  var wantSound = stored !== '0';

  function setToggleUI(on) {
    toggle.classList.toggle('is-on', on);
    toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    stateEl.textContent = on ? 'ON' : 'OFF';
  }

  function showHint(show) { hintEl.classList.toggle('show', show); }

  // ── Audio ──────────────────────────────────────────────
  function ensureCtx() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function loadBuffer(c) {
    if (buffer) return Promise.resolve(buffer);
    return fetch(AUDIO_URL)
      .then(function (r) {
        if (!r.ok) throw new Error('fetch ' + r.status);
        return r.arrayBuffer();
      })
      .then(function (arr) {
        return new Promise(function (res, rej) { c.decodeAudioData(arr, res, rej); });
      })
      .then(function (buf) { buffer = buf; return buf; });
  }

  function startDrone() {
    if (nodes) return Promise.resolve(true);
    var c = ensureCtx();
    return loadBuffer(c).then(function (buf) {
      var source   = c.createBufferSource();
      source.buffer = buf;
      source.loop   = true;                 // sample-accurate loop, no seam click
      source.playbackRate.value = PLAYBACK_RATE;
      var gain     = c.createGain();
      var analyser = c.createAnalyser();
      analyser.fftSize = 1024;
      gain.gain.value = 0;
      source.connect(analyser); analyser.connect(gain); gain.connect(c.destination);
      source.start(0);
      gain.gain.linearRampToValueAtTime(TARGET_VOLUME, c.currentTime + 1.2);
      nodes = { source: source, gain: gain, analyser: analyser };
      pulseFromAudio();
      return c.state === 'running';
    }).catch(function (err) {
      console.warn('[cave] audio failed', err && err.message);
      return false;
    });
  }

  function stopDrone() {
    if (!nodes) return;
    var n = nodes;
    nodes = null;
    try { n.gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4); } catch (e) {}
    setTimeout(function () { try { n.source.stop(); } catch (e) {} }, 500);
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    pulseLFO();
  }

  // ── Pulse ──────────────────────────────────────────────
  // A drone loop has near-constant amplitude, so raw RMS would flatline.
  // Blend a 12s breathing cycle (most of the movement) with audio activity
  // (subtle modulation that ties the visual to the sound), then low-pass it.
  function pulseFromAudio() {
    if (raf) cancelAnimationFrame(raf);
    var buf = new Uint8Array(nodes.analyser.fftSize);
    var start = performance.now(), period = 12000, smoothed = 0;
    (function tick(now) {
      if (!nodes) return;
      nodes.analyser.getByteTimeDomainData(buf);
      var sum = 0;
      for (var i = 0; i < buf.length; i++) {
        var v = (buf[i] - 128) / 128;
        sum += v * v;
      }
      var rms    = Math.sqrt(sum / buf.length);
      var phase  = ((now - start) % period) / period;
      var breath = (1 - Math.cos(phase * Math.PI * 2)) / 2;
      var target = breath * 0.7 + Math.min(1, rms) * 0.3;
      smoothed  += (target - smoothed) * 0.08;
      root.style.setProperty('--cave-pulse', smoothed.toFixed(3));
      raf = requestAnimationFrame(tick);
    })(performance.now());
  }

  // Visual-only breathing when sound is off, so the mark never goes static.
  function pulseLFO() {
    if (raf) cancelAnimationFrame(raf);
    var start = performance.now(), period = 12000;
    (function tick(now) {
      if (nodes) return;                    // audio-driven pulse took over
      var phase = ((now - start) % period) / period;
      root.style.setProperty('--cave-pulse', ((1 - Math.cos(phase * Math.PI * 2)) / 2).toFixed(3));
      raf = requestAnimationFrame(tick);
    })(performance.now());
  }

  // ── Wiring ─────────────────────────────────────────────
  setToggleUI(wantSound);
  pulseLFO();

  toggle.addEventListener('click', function () {
    wantSound = !wantSound;
    setToggleUI(wantSound);
    try { localStorage.setItem(STORAGE_KEY, wantSound ? '1' : '0'); } catch (e) {}
    if (wantSound) {
      startDrone().then(function (ok) { showHint(!ok); });
    } else {
      stopDrone();
      showHint(false);
    }
  });

  // Autoplay: every current browser blocks audio until the visitor interacts,
  // so "default on" cannot literally mean "already playing on load". We try
  // anyway — some contexts allow it — and if we're blocked, the toggle stays
  // ON, a hint appears, and the first gesture anywhere starts the drone. That
  // gesture path is what makes it work on iOS Safari.
  if (wantSound) {
    startDrone().then(function (playing) {
      if (playing) return;
      showHint(true);
      var primed = false;
      function prime() {
        if (primed || !wantSound) return;
        primed = true;
        if (ctx && ctx.state === 'suspended') ctx.resume();
        if (!nodes) startDrone();
        showHint(false);
      }
      ['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, prime, { once: true, passive: true });
      });
    });
  }

  // Note: the app's cold-load swirl (172 SVG ribbon paths flying in over ~7s)
  // is deliberately NOT here. This page mirrors the logo-click re-show, which
  // skips it — the mark is simply present and breathing. It also means the
  // logo is a plain <img>: nothing to fetch, parse or animate, so there is no
  // state in which the mark fails to appear.
})();
</script>
